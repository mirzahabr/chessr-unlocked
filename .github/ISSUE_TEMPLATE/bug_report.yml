name: Bug report
description: Something in the unlocked build does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: read the **Troubleshooting** and **FAQ** sections of the README —
        the Stream Mode blank-page bug, the failing "Explain move" feature and the missing
        overlay have documented causes.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Exactly as shown on chrome://extensions/ (e.g. 3.4.0.1)
      placeholder: 3.4.0.1
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Browser and OS
      description: e.g. Chrome 141 / macOS 26, or Edge 141 / Windows 11
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: Site
      options:
        - chess.com
        - lichess.org
        - worldchess.com
        - Stream Mode (stream.html)
        - other / not site-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the extension unpacked
        2. Open a rated game on chess.com
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Console errors
      description: Page console **and** the extension's service worker console (chrome://extensions → Details → service worker → Inspect)
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I am on Chromium 111 or newer
          required: true
        - label: I read the README's Troubleshooting and FAQ sections
          required: true
        - label: I understand this build is unofficial and used at my own risk
          required: true
