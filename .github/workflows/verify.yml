name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository
        run: python3 scripts/verify.py --verbose

      - name: Check working tree stayed clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the validation run modified tracked files"
            git status --short
            exit 1
          fi
