name: release

# Tags are named v<version>-unlocked, e.g. v3.7.2-unlocked.
on:
  push:
    tags:
      - "v*-unlocked"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate before packaging
        run: python3 scripts/verify.py

      - name: Package both builds and checksum them
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version%-unlocked}"
          src="versions/${version}"
          if [ ! -d "$src" ]; then
            echo "::error::no directory for $version at $src"
            exit 1
          fi

          mkdir -p dist
          # The baseline is committed as-is.
          tar -czf "dist/chessr-original-restored-${version}.tar.gz" -C "$src" chessr-original-restored

          # The unlocked build is generated from the baseline + patches, so the
          # archive always matches the committed series.
          tmp="$(mktemp -d)"
          bash scripts/build-unlocked.sh "$version" "$tmp/chessr-unlocked-all-features"
          tar -czf "dist/chessr-unlocked-all-features-${version}.tar.gz" \
            -C "$tmp" chessr-unlocked-all-features
          rm -rf "$tmp"

          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Verify the download against SHA256SUMS.txt before loading the extension. **Use at your own risk** — see the disclaimer in the README."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Chessr.io ${GITHUB_REF_NAME#v}" \
              --notes "$notes"
          fi
