<!--
  Chessr "Stream Mode" host page.
  Opened as its own extension tab by background.js in response to the
  "open_stream" runtime message (sent from the React overlay in
  content-scripts/content.js, typically via a button in the injected UI).
  It boots the Stream Mode React app (chunks/stream-Cq9Ik-VD.js) styled by
  assets/stream-DMcmulGQ.css. See project-documentation/PROJECT_REPORT.md
  for how this page fits into the extension's architecture.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessr.io · Stream Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0f;
        color: #e4e4e7;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
      }
    </style>
    <!--
      Loaded as a classic deferred script, NOT type="module".

      The bundle contains no ESM syntax (no import/export/import.meta), so it
      does not need to be a module. It does contain assignments to undeclared
      variables — an artifact of the deobfuscation pass, which rewrote React's
      `var f; if (a) { f = function(){} }` into a block-scoped `function f(){}`,
      leaving the sibling branches assigning an undeclared name. Harmless as an
      implicit global in sloppy mode (how content.js runs, hence the in-page
      overlay works) but a hard ReferenceError under a module's implicit strict
      mode — it crashed React's scheduler on load and left this page blank.

      `defer` preserves the "run after the document is parsed" timing that
      type="module" provided — required, since the bundle mounts into #app.
    -->
    <script defer src="/chunks/stream-Cq9Ik-VD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/stream-DMcmulGQ.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
