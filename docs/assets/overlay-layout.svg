<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Schematic of the Chessr.io overlay</title>
  <desc id="desc">A labelled wireframe, not a screenshot: evaluation bar on the left, best-move arrow and move-quality badge on the board, floating action button and settings panel on the right.</desc>

  <rect width="1120" height="640" fill="#15171a"/>

  <text x="48" y="52" fill="#e8eaed" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600">Chessr.io overlay — layout schematic</text>
  <text x="48" y="76" fill="#9aa0a6" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Hand-drawn from the code. Not a screenshot — see the note at the bottom.</text>

  <!-- board -->
  <g>
    <rect x="200" y="110" width="448" height="448" fill="#b9c4cf" rx="3"/>
    <g>
      <rect x="200" y="110" width="56" height="56" fill="#eef1f4"/>
      <rect x="256" y="110" width="56" height="56" fill="#7f9bb3"/>
      <rect x="312" y="110" width="56" height="56" fill="#eef1f4"/>
      <rect x="368" y="110" width="56" height="56" fill="#7f9bb3"/>
      <rect x="424" y="110" width="56" height="56" fill="#eef1f4"/>
      <rect x="480" y="110" width="56" height="56" fill="#7f9bb3"/>
      <rect x="536" y="110" width="56" height="56" fill="#eef1f4"/>
      <rect x="592" y="110" width="56" height="56" fill="#7f9bb3"/>

      <rect x="200" y="166" width="56" height="56" fill="#7f9bb3"/>
      <rect x="256" y="166" width="56" height="56" fill="#eef1f4"/>
      <rect x="312" y="166" width="56" height="56" fill="#7f9bb3"/>
      <rect x="368" y="166" width="56" height="56" fill="#eef1f4"/>
      <rect x="424" y="166" width="56" height="56" fill="#7f9bb3"/>
      <rect x="480" y="166" width="56" height="56" fill="#eef1f4"/>
      <rect x="536" y="166" width="56" height="56" fill="#7f9bb3"/>
      <rect x="592" y="166" width="56" height="56" fill="#eef1f4"/>

      <rect x="200" y="222" width="56" height="56" fill="#eef1f4"/>
      <rect x="256" y="222" width="56" height="56" fill="#7f9bb3"/>
      <rect x="312" y="222" width="56" height="56" fill="#eef1f4"/>
      <rect x="368" y="222" width="56" height="56" fill="#7f9bb3"/>
      <rect x="424" y="222" width="56" height="56" fill="#eef1f4"/>
      <rect x="480" y="222" width="56" height="56" fill="#7f9bb3"/>
      <rect x="536" y="222" width="56" height="56" fill="#eef1f4"/>
      <rect x="592" y="222" width="56" height="56" fill="#7f9bb3"/>

      <rect x="200" y="278" width="56" height="56" fill="#7f9bb3"/>
      <rect x="256" y="278" width="56" height="56" fill="#eef1f4"/>
      <rect x="312" y="278" width="56" height="56" fill="#7f9bb3"/>
      <rect x="368" y="278" width="56" height="56" fill="#eef1f4"/>
      <rect x="424" y="278" width="56" height="56" fill="#7f9bb3"/>
      <rect x="480" y="278" width="56" height="56" fill="#eef1f4"/>
      <rect x="536" y="278" width="56" height="56" fill="#7f9bb3"/>
      <rect x="592" y="278" width="56" height="56" fill="#eef1f4"/>

      <rect x="200" y="334" width="56" height="56" fill="#eef1f4"/>
      <rect x="256" y="334" width="56" height="56" fill="#7f9bb3"/>
      <rect x="312" y="334" width="56" height="56" fill="#eef1f4"/>
      <rect x="368" y="334" width="56" height="56" fill="#7f9bb3"/>
      <rect x="424" y="334" width="56" height="56" fill="#eef1f4"/>
      <rect x="480" y="334" width="56" height="56" fill="#7f9bb3"/>
      <rect x="536" y="334" width="56" height="56" fill="#eef1f4"/>
      <rect x="592" y="334" width="56" height="56" fill="#7f9bb3"/>

      <rect x="200" y="390" width="56" height="56" fill="#7f9bb3"/>
      <rect x="256" y="390" width="56" height="56" fill="#eef1f4"/>
      <rect x="312" y="390" width="56" height="56" fill="#7f9bb3"/>
      <rect x="368" y="390" width="56" height="56" fill="#eef1f4"/>
      <rect x="424" y="390" width="56" height="56" fill="#7f9bb3"/>
      <rect x="480" y="390" width="56" height="56" fill="#eef1f4"/>
      <rect x="536" y="390" width="56" height="56" fill="#7f9bb3"/>
      <rect x="592" y="390" width="56" height="56" fill="#eef1f4"/>

      <rect x="200" y="446" width="56" height="56" fill="#eef1f4"/>
      <rect x="256" y="446" width="56" height="56" fill="#7f9bb3"/>
      <rect x="312" y="446" width="56" height="56" fill="#eef1f4"/>
      <rect x="368" y="446" width="56" height="56" fill="#7f9bb3"/>
      <rect x="424" y="446" width="56" height="56" fill="#eef1f4"/>
      <rect x="480" y="446" width="56" height="56" fill="#7f9bb3"/>
      <rect x="536" y="446" width="56" height="56" fill="#eef1f4"/>
      <rect x="592" y="446" width="56" height="56" fill="#7f9bb3"/>

      <rect x="200" y="502" width="56" height="56" fill="#7f9bb3"/>
      <rect x="256" y="502" width="56" height="56" fill="#eef1f4"/>
      <rect x="312" y="502" width="56" height="56" fill="#7f9bb3"/>
      <rect x="368" y="502" width="56" height="56" fill="#eef1f4"/>
      <rect x="424" y="502" width="56" height="56" fill="#7f9bb3"/>
      <rect x="480" y="502" width="56" height="56" fill="#eef1f4"/>
      <rect x="536" y="502" width="56" height="56" fill="#7f9bb3"/>
      <rect x="592" y="502" width="56" height="56" fill="#eef1f4"/>
    </g>

    <!-- e2 highlight -->
    <rect x="424" y="446" width="56" height="56" fill="#3b83d9" opacity="0.35"/>
    <!-- e4 destination highlight -->
    <rect x="424" y="334" width="56" height="56" fill="#3b83d9" opacity="0.25"/>

    <!-- best-move arrow e2 -> e4 -->
    <g>
      <line x1="452" y1="470" x2="452" y2="378" stroke="#3b83d9" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
      <polygon points="452,360 440,384 464,384" fill="#3b83d9" opacity="0.9"/>
    </g>

    <!-- move-quality badge on e4 -->
    <g>
      <circle cx="452" cy="362" r="15" fill="#3b83d9"/>
      <path d="M445 362 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- coordinate labels -->
    <g fill="#15171a" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.55">
      <text x="204" y="556">a</text><text x="260" y="556">b</text><text x="316" y="556">c</text><text x="372" y="556">d</text>
      <text x="428" y="556">e</text><text x="484" y="556">f</text><text x="540" y="556">g</text><text x="596" y="556">h</text>
    </g>
  </g>

  <!-- evaluation bar -->
  <g>
    <rect x="120" y="110" width="30" height="448" fill="#2b2f36" rx="4"/>
    <rect x="120" y="362" width="30" height="196" fill="#e8eaed" rx="4"/>
    <rect x="120" y="358" width="30" height="8" fill="#3b83d9"/>
    <text x="135" y="585" fill="#9aa0a6" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">eval</text>
    <text x="135" y="600" fill="#e8eaed" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">+1.4</text>
  </g>

  <!-- floating action button column -->
  <g>
    <circle cx="700" cy="150" r="26" fill="#2b2f36" stroke="#3f444c" stroke-width="1.5"/>
    <rect x="690" y="142" width="20" height="16" rx="2" fill="none" stroke="#c6cbd1" stroke-width="2"/>
    <circle cx="700" cy="150" r="4" fill="#c6cbd1"/>
    <circle cx="700" cy="218" r="26" fill="#3b83d9"/>
    <path d="M700 207 v22 M689 218 h22" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- settings panel -->
  <g>
    <rect x="756" y="270" width="316" height="288" rx="12" fill="#1f2227" stroke="#3f444c" stroke-width="1.5"/>
    <text x="778" y="302" fill="#e8eaed" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Settings</text>
    <line x1="756" y1="318" x2="1072" y2="318" stroke="#3f444c"/>

    <text x="778" y="348" fill="#c6cbd1" font-family="Inter, system-ui, sans-serif" font-size="12.5">Engine</text>
    <rect x="940" y="336" width="110" height="16" rx="8" fill="#2b2f36"/>
    <text x="1062" y="348" fill="#9aa0a6" font-family="Inter, system-ui, sans-serif" font-size="11.5" text-anchor="end">Stockfish</text>

    <text x="778" y="382" fill="#c6cbd1" font-family="Inter, system-ui, sans-serif" font-size="12.5">Target ELO</text>
    <rect x="940" y="370" width="110" height="16" rx="8" fill="#2b2f36"/>
    <text x="1062" y="382" fill="#9aa0a6" font-family="Inter, system-ui, sans-serif" font-size="11.5" text-anchor="end">3500</text>

    <text x="778" y="416" fill="#c6cbd1" font-family="Inter, system-ui, sans-serif" font-size="12.5">Multi-PV depth</text>
    <rect x="940" y="404" width="110" height="16" rx="8" fill="#2b2f36"/>
    <text x="1062" y="416" fill="#9aa0a6" font-family="Inter, system-ui, sans-serif" font-size="11.5" text-anchor="end">unlimited</text>

    <text x="778" y="450" fill="#c6cbd1" font-family="Inter, system-ui, sans-serif" font-size="12.5">Show arrows</text>
    <rect x="940" y="438" width="34" height="18" rx="9" fill="#3b83d9"/>
    <circle cx="965" cy="447" r="7" fill="#fff"/>

    <text x="778" y="484" fill="#c6cbd1" font-family="Inter, system-ui, sans-serif" font-size="12.5">Show badge</text>
    <rect x="940" y="472" width="34" height="18" rx="9" fill="#3b83d9"/>
    <circle cx="965" cy="481" r="7" fill="#fff"/>

    <text x="778" y="518" fill="#c6cbd1" font-family="Inter, system-ui, sans-serif" font-size="12.5">Stream mode</text>
    <rect x="940" y="506" width="34" height="18" rx="9" fill="#2b2f36"/>
    <circle cx="947" cy="515" r="7" fill="#8b9096"/>
  </g>

  <!-- callouts -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <g stroke="#3f444c" stroke-dasharray="3 3" fill="none">
      <line x1="150" y1="334" x2="196" y2="334"/>
      <line x1="620" y1="362" x2="676" y2="362"/>
      <line x1="1072" y1="400" x2="1092" y2="400"/>
    </g>
    <text x="48" y="330" fill="#9aa0a6">Eval bar</text>
    <text x="648" y="340" fill="#9aa0a6" text-anchor="start">Best move</text>
    <text x="648" y="356" fill="#9aa0a6" text-anchor="start">+ quality badge</text>
  </g>

  <rect x="48" y="596" width="1" height="1" fill="none"/>
  <text x="48" y="626" fill="#7c8288" font-family="Inter, system-ui, sans-serif" font-size="11.5">Schematic, not a screenshot: positions of the widgets are accurate to the code, but this is not what the overlay renders pixel-for-pixel.</text>
</svg>
